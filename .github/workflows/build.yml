name: Build Userscript

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build userscript
        run: npm run build

      - name: Check generated userscript
        run: node --check video-hardsub-translator.user.js

      - name: Upload userscript
        uses: actions/upload-artifact@v4
        with:
          name: video-hardsub-translator-vietnamese
          path: video-hardsub-translator.user.js
          if-no-files-found: error
          retention-days: 14
