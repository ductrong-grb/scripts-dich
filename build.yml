
name: Build Userscript

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run build

      - name: Check JavaScript
        run: node --check video-hardsub-translator.user.js

      - uses: actions/upload-artifact@v4
        with:
          name: vietnamese-userscript
          path: video-hardsub-translator.user.js
